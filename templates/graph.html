{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block head %}
<meta http-equiv="refresh" content="10">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .wrap { max-width: 1000px; height: 70vh; margin: 0 auto; }
  .n { font-size: 1.2rem; color: #555; }
</style>
{% endblock %}
{% block body %}
<h1>{{ title }}</h1>
<p class="n">Responses: {{ n }}</p>
<div class="wrap"><canvas id="chart"></canvas></div>
<script>
  new Chart(document.getElementById("chart"), {
    type: {{ kind|tojson }},
    data: {
      labels: {{ labels|tojson }},
      datasets: [{
        data: {{ counts|tojson }},
        backgroundColor: "#2a6fdb",
        borderColor: "#2a6fdb",
        borderWidth: 3,
        pointRadius: 6,
        tension: 0
      }]
    },
    options: {
      maintainAspectRatio: false,
      animation: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { title: { display: true, text: {{ x_label|tojson }}, font: { size: 18 } },
             ticks: { font: { size: 16 } } },
        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 16 } },
             title: { display: true, text: {{ y_label|tojson }}, font: { size: 18 } } }
      }
    }
  });
</script>
{% endblock %}
