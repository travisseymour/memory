<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Memory{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; text-align: center;
           background: #fafafa; color: #222; }
    h1 { font-size: 2.6rem; line-height: 1.2; margin: 0.5em 0; }
    button { font-size: 1.8rem; padding: 0.4em 1.6em; border-radius: 10px; border: none;
             background: #2a6fdb; color: white; cursor: pointer; }
    button:hover { background: #1f58b3; }
    .msg { font-size: 1.4rem; color: #1a7f37; }
    .err { font-size: 1.4rem; color: #c62828; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
